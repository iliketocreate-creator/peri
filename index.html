<!DOCTYPE html>
<html>
<head>
  <title>Simple Perimeter Calculator</title>
</head>
<body>

  <h2>Perimeter Calculator</h2>

 
  <label>Shape:</label>
  <select id="shape">
    <option value="square">Square</option>
    <option value="rectangle">Rectangle</option>
    <option value="circle">Circle</option>
    <option value="triangle">Triangle</option>
  </select>
  <br><br>

  
  <input type="number" id="num1" placeholder="Side / Length / Radius"><br><br>
  <input type="number" id="num2" placeholder="Width / Side B (if needed)"><br><br>
  <input type="number" id="num3" placeholder="Side C (Triangle only)"><br><br>

  <!-- 3. Button and Result -->
  <button onclick="calculate()">Calculate</button>
  <h3 id="result">Perimeter: 0</h3>

  <script>
    function calculate() {
      
      let shape = document.getElementById("shape").value;
      let a = Number(document.getElementById("num1").value);
      let b = Number(document.getElementById("num2").value);
      let c = Number(document.getElementById("num3").value);
      let perimeter = 0;

      
      if (shape === "square") {
        perimeter = 4 * a;
      } else if (shape === "rectangle") {
        perimeter = 2 * (a + b);
      } else if (shape === "circle") {
        perimeter = 2 * 3.14 * a;
      } else if (shape === "triangle") {
        perimeter = a + b + c;
      }

      // Show the answer
      document.getElementById("result").innerText = "Perimeter: " + perimeter;
    }
  </script>

</body>
</html>
